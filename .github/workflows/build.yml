name: Build DSi Video Hub

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Build NDS
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work/SpiderVerse-DSi-Video-Hub-GitHub-Starter \
            skylyrac/blocksds:slim-latest \
            make

      - name: Upload NDS file
        uses: actions/upload-artifact@v4
        with:
          name: SpiderVerse-Video-Hub
          path: SpiderVerse-DSi-Video-Hub-GitHub-Starter/*.nds
